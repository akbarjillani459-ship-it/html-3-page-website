
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Explore Pakistan - Contact</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h2 class="logo">Explore Pakistan</h2>

        <nav>
            <a href="index.html">Home</a>
            <a href="destinations.html">Destinations</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>

    <section class="page-heading">
        <h1>Contact Us</h1>
        <p>Have a question? Send us a message.</p>
    </section>

    <section class="contact-section">

        <div class="contact-info">
            <h2>Get In Touch</h2>
            <p>We would love to hear from you.</p>
            <p><strong>Website:</strong> Explorepakistan.com</p>
            <p><strong>Email:</strong> hasnain@gmail.com</p>
            <p><strong>Purpose:</strong> Travel and tourism information</p>
        </div>

        <form class="contact-form" action="#" method="get">
            <label for="name">Your Name</label>
            <input
                type="text"
                id="name"
                name="name"
                placeholder="Enter your name"
                required>

            <label for="email">Your Email</label>
            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email"
                required>

            <label for="message">Your Message</label>
            <textarea
                id="message"
                name="message"
                rows="5"
                placeholder="Write your message here..."
                required></textarea>

            <button type="submit">Send Message</button>
        </form>

    </section>

    <footer>
        <p>© 2026 Explore Pakistan | HTML & CSS Project</p>
    </footer>

</body>
</html>
